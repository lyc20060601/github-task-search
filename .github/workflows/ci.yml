name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  repository:
    name: Release metadata checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Parse lifecycle scripts
        shell: bash
        run: |
          sh -n scripts/start.sh scripts/stop.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/start.ps1)); $null = [scriptblock]::Create((Get-Content -Raw scripts/stop.ps1))'
      - name: Reject credential-shaped tracked values
        shell: bash
        run: |
          if git grep -I -n -E 'github_pat_[A-Za-z0-9_]{40,}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{24,}' -- . ':(exclude)backend/tests/**' ':(exclude)docs/superpowers/**'; then
            echo 'Credential-shaped value found in a tracked file.' >&2
            exit 1
          fi
      - name: Reject maintainer-specific absolute paths
        shell: bash
        run: |
          if git grep -I -n -E '[A-Za-z]:\\Users\\[^\\]+|/Users/[^/]+|/home/[^/]+' -- README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md docker-compose.yml backend frontend scripts ':(exclude)backend/tests/**'; then
            echo 'Maintainer-specific absolute path found in release files.' >&2
            exit 1
          fi
